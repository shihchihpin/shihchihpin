<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極致美感計算機 | Premium Calculator</title>
  <!-- Google Fonts: Orbitron for digital display, Inter for UI text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Background Spheres for Glassmorphism depth -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-glow bg-glow-3"></div>

  <div class="calculator-container" id="calculator">
    <!-- Header: Theme & History Toggle -->
    <header class="calc-header">
      <button class="icon-btn" id="theme-toggle" title="切換主題" aria-label="Toggle Theme">
        <!-- Sun icon for light mode, Moon icon for dark mode (SVGs) -->
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20">
          <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <span class="calc-logo">CALCULATOR</span>

      <button class="icon-btn" id="history-toggle" title="計算歷史" aria-label="Toggle History">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <!-- Display Screen -->
    <div class="calc-screen">
      <div class="expression-display" id="expression-display"></div>
      <div class="result-display" id="result-display">0</div>
    </div>

    <!-- Mode Selector / Expand Button for Scientific Mode -->
    <div class="mode-selector">
      <button class="mode-btn active" id="btn-mode-basic">基本</button>
      <button class="mode-btn" id="btn-mode-scientific">科學</button>
    </div>

    <!-- Keyboard Area -->
    <div class="keypad-wrapper">
      <!-- Scientific Keys (hidden or minimized by default) -->
      <div class="scientific-keys" id="scientific-keys">
        <button class="btn btn-sci" data-action="sin">sin</button>
        <button class="btn btn-sci" data-action="cos">cos</button>
        <button class="btn btn-sci" data-action="tan">tan</button>
        <button class="btn btn-sci" data-action="log">log</button>
        <button class="btn btn-sci" data-action="ln">ln</button>
        <button class="btn btn-sci" data-action="sqrt">√</button>
        <button class="btn btn-sci" data-action="pow">xʸ</button>
        <button class="btn btn-sci" data-val="PI">π</button>
        <button class="btn btn-sci" data-val="E">e</button>
        <button class="btn btn-sci" data-val="(">(</button>
        <button class="btn btn-sci" data-val=")">)</button>
        <button class="btn btn-sci" data-action="fact">x!</button>
      </div>

      <!-- Basic Keys -->
      <div class="basic-keys">
        <!-- Row 1: Clear, Backspace, Modulo, Divide -->
        <button class="btn btn-util" data-action="clear">C</button>
        <button class="btn btn-util" data-action="backspace">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2zM18 9l-6 6m0-6l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="btn btn-util" data-val="%">%</button>
        <button class="btn btn-op" data-val="/">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button class="btn btn-num" data-val="7">7</button>
        <button class="btn btn-num" data-val="8">8</button>
        <button class="btn btn-num" data-val="9">9</button>
        <button class="btn btn-op" data-val="*">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button class="btn btn-num" data-val="4">4</button>
        <button class="btn btn-num" data-val="5">5</button>
        <button class="btn btn-num" data-val="6">6</button>
        <button class="btn btn-op" data-val="-">-</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button class="btn btn-num" data-val="1">1</button>
        <button class="btn btn-num" data-val="2">2</button>
        <button class="btn btn-num" data-val="3">3</button>
        <button class="btn btn-op" data-val="+">+</button>

        <!-- Row 5: Negate, 0, Decimal, Equal -->
        <button class="btn btn-num" data-action="negate">±</button>
        <button class="btn btn-num" data-val="0">0</button>
        <button class="btn btn-num" data-val=".">.</button>
        <button class="btn btn-equal" data-action="calculate">=</button>
      </div>
    </div>

    <!-- History Panel Side Drawer -->
    <div class="history-panel" id="history-panel">
      <div class="history-header">
        <h3>計算歷史</h3>
        <button class="text-btn" id="clear-history">清除</button>
      </div>
      <div class="history-list" id="history-list">
        <!-- Dynamically populated -->
        <div class="empty-history">尚無紀錄</div>
      </div>
    </div>
  </div>

  <!-- JavaScript logic -->
  <script src="app.js"></script>
</body>
</html>
